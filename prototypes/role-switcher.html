<style>
  #role-switcher-compact-preview {
    --account-surface: light-dark(#ffffff, #242527);
    --account-text: light-dark(#142b41, #f2f1f0);
    --account-muted: light-dark(#526978, #babbc0);
    --account-border: light-dark(#d8e2e8, #414246);
    --account-hover: light-dark(#f5f8f9, #2d2e30);
    --account-selection: light-dark(#dfefee, #393340);
    --account-accent: light-dark(#075e66, #c9b9ea);
    --account-accent-foreground: light-dark(#ffffff, #24202b);
    display: flex;
    width: 100%;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
    color-scheme: light;
    color: var(--account-text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }

  #role-switcher-compact-preview[data-theme="dark"] {
    color-scheme: dark;
  }

  #role-switcher-compact-preview *,
  #role-switcher-compact-preview *::before,
  #role-switcher-compact-preview *::after {
    box-sizing: border-box;
  }

  #role-switcher-compact-preview .account-popover,
  #role-switcher-compact-preview .account-trigger {
    width: min(100%, 264px);
    border: 1px solid var(--account-border);
    border-radius: 12px;
    background: var(--account-surface);
  }

  #role-switcher-compact-preview .account-popover {
    padding: 8px;
    box-shadow: 0 12px 28px light-dark(rgb(20 43 65 / 12%), rgb(0 0 0 / 30%));
  }

  #role-switcher-compact-preview .menu-row {
    display: flex;
    width: 100%;
    min-height: 42px;
    align-items: center;
    gap: 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    padding: 8px 10px;
    color: var(--account-text);
    text-align: left;
    cursor: pointer;
  }

  #role-switcher-compact-preview .menu-row:hover {
    background: var(--account-hover);
  }

  #role-switcher-compact-preview .menu-row > span:first-of-type {
    flex: 1;
  }

  #role-switcher-compact-preview .menu-icon {
    width: 16px;
    height: 16px;
    flex: none;
    color: var(--account-muted);
  }

  #role-switcher-compact-preview .role-chevron {
    transition: transform 180ms ease-out;
  }

  #role-switcher-compact-preview #role-switcher-toggle[aria-expanded="true"] .role-chevron {
    transform: rotate(180deg);
  }

  #role-switcher-compact-preview .role-options {
    display: grid;
    gap: 2px;
    margin: 0 0 4px 28px;
    padding: 0;
    border: 0;
  }

  #role-switcher-compact-preview .role-options[hidden] {
    display: none;
  }

  #role-switcher-compact-preview .role-option {
    position: relative;
    display: flex;
    min-height: 34px;
    align-items: center;
    gap: 8px;
    border-radius: 6px;
    padding: 5px 8px;
    color: var(--account-muted);
    cursor: pointer;
  }

  #role-switcher-compact-preview .role-option:has(input:checked) {
    background: var(--account-selection);
    color: var(--account-accent);
    font-weight: 600;
  }

  #role-switcher-compact-preview .role-option:has(input:focus-visible) {
    outline: 2px solid var(--account-accent);
    outline-offset: 1px;
  }

  #role-switcher-compact-preview .role-option input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  #role-switcher-compact-preview .role-option span {
    flex: 1;
  }

  #role-switcher-compact-preview .role-option small {
    color: var(--account-muted);
    font-size: 11px;
    font-weight: 500;
  }

  #role-switcher-compact-preview .role-check {
    width: 15px;
    height: 15px;
    flex: none;
    opacity: 0;
  }

  #role-switcher-compact-preview .role-option:has(input:checked) .role-check {
    opacity: 1;
  }

  #role-switcher-compact-preview .menu-divider {
    height: 1px;
    margin: 5px 0;
    border: 0;
    background: var(--account-border);
  }

  #role-switcher-compact-preview .preference-row {
    display: flex;
    min-height: 44px;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 8px;
    color: var(--account-text);
  }

  #role-switcher-compact-preview .theme-switch {
    position: relative;
    width: 44px;
    height: 26px;
    flex: none;
    border: 1px solid var(--account-muted);
    border-radius: 999px;
    background: var(--account-hover);
    cursor: pointer;
  }

  #role-switcher-compact-preview .theme-switch::after {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--account-muted);
    content: "";
    transition: transform 180ms ease-out, background-color 180ms ease-out;
  }

  #role-switcher-compact-preview .theme-switch[aria-checked="true"] {
    border-color: var(--account-accent);
    background: var(--account-accent);
  }

  #role-switcher-compact-preview .theme-switch[aria-checked="true"]::after {
    transform: translateX(18px);
    background: var(--account-accent-foreground);
  }

  #role-switcher-compact-preview .language-options {
    display: flex;
    gap: 4px;
  }

  #role-switcher-compact-preview .language-option {
    min-width: 42px;
    min-height: 36px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--account-muted);
    cursor: pointer;
  }

  #role-switcher-compact-preview .language-option[aria-pressed="true"] {
    background: var(--account-selection);
    color: var(--account-text);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  #role-switcher-compact-preview .account-trigger {
    display: flex;
    min-height: 54px;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    color: var(--account-text);
    text-align: left;
  }

  #role-switcher-compact-preview .avatar {
    display: grid;
    width: 36px;
    height: 36px;
    flex: none;
    place-items: center;
    border-radius: 50%;
    background: var(--account-selection);
    font-weight: 600;
  }

  #role-switcher-compact-preview .account-copy {
    display: grid;
    min-width: 0;
    flex: 1;
    line-height: 1.3;
  }

  #role-switcher-compact-preview .account-copy strong {
    font-size: 14px;
    font-weight: 600;
  }

  #role-switcher-compact-preview .account-copy span {
    overflow: hidden;
    color: var(--account-muted);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #role-switcher-compact-preview .account-trigger .menu-icon {
    width: 16px;
    height: 16px;
  }

  #role-switcher-compact-preview .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    clip-path: inset(50%);
  }
</style>

<div id="role-switcher-compact-preview" class="viz-dotted-background" data-theme="light" role="region" aria-label="Menú de cuenta de MARSYS">
  <section class="account-popover" aria-label="Opciones de cuenta">
    <button class="menu-row" type="button" aria-label="Mi perfil">
      <i class="menu-icon" data-lucide="user-round" aria-hidden="true"></i>
      <span>Mi perfil</span>
    </button>
    <button class="menu-row" id="role-switcher-toggle" type="button" aria-expanded="true" aria-controls="role-switcher-options">
      <i class="menu-icon" data-lucide="arrow-left-right" aria-hidden="true"></i>
      <span>Cambiar rol</span>
      <i class="menu-icon role-chevron" data-lucide="chevron-down" aria-hidden="true"></i>
    </button>
    <fieldset class="role-options" id="role-switcher-options" role="radiogroup" aria-label="Roles asignados">
      <legend class="sr-only">Selecciona el rol activo</legend>
      <label class="role-option">
        <input type="radio" name="assigned-role" value="Apoyo docente" checked>
        <span>Apoyo docente</span>
        <small>Actual</small>
        <i class="role-check" data-lucide="check" aria-hidden="true"></i>
      </label>
      <label class="role-option">
        <input type="radio" name="assigned-role" value="Secretario docente">
        <span>Secretario docente</span>
        <i class="role-check" data-lucide="check" aria-hidden="true"></i>
      </label>
      <label class="role-option">
        <input type="radio" name="assigned-role" value="Analista académico">
        <span>Analista académico</span>
        <i class="role-check" data-lucide="check" aria-hidden="true"></i>
      </label>
    </fieldset>
    <hr class="menu-divider">
    <div class="preference-row">
      <span>Modo oscuro</span>
      <button class="theme-switch" id="role-switcher-theme" type="button" role="switch" aria-label="Modo oscuro" aria-checked="false"></button>
    </div>
    <div class="preference-row">
      <span>Idioma</span>
      <span class="language-options" role="group" aria-label="Idioma">
        <button class="language-option" type="button" aria-pressed="true">ES</button>
        <button class="language-option" type="button" aria-pressed="false">EN</button>
      </span>
    </div>
    <hr class="menu-divider">
    <button class="menu-row" type="button" aria-label="Cerrar sesión">
      <i class="menu-icon" data-lucide="log-out" aria-hidden="true"></i>
      <span>Cerrar sesión</span>
    </button>
    <span class="sr-only" id="role-switcher-status" aria-live="polite"></span>
  </section>

  <button class="account-trigger" type="button" aria-label="Mi cuenta, rol activo">
    <span class="avatar" aria-hidden="true">M</span>
    <span class="account-copy">
      <strong>Mi cuenta</strong>
      <span id="role-switcher-active-role">Apoyo docente</span>
    </span>
    <i class="menu-icon" data-lucide="chevrons-up-down" aria-hidden="true"></i>
  </button>
</div>

<script>
  const rolePreview = document.getElementById("role-switcher-compact-preview");
  const roleToggle = rolePreview.querySelector("#role-switcher-toggle");
  const roleOptions = rolePreview.querySelector("#role-switcher-options");
  const roleStatus = rolePreview.querySelector("#role-switcher-status");
  const activeRole = rolePreview.querySelector("#role-switcher-active-role");

  roleToggle.addEventListener("click", () => {
    const expanded = roleToggle.getAttribute("aria-expanded") !== "true";
    roleToggle.setAttribute("aria-expanded", String(expanded));
    roleOptions.hidden = !expanded;
  });

  roleOptions.querySelectorAll("input").forEach((input) => {
    input.addEventListener("change", () => {
      activeRole.textContent = input.value;
      roleStatus.textContent = "Rol activo: " + input.value;
      roleOptions.querySelectorAll("small").forEach((label) => label.remove());
      const activeLabel = document.createElement("small");
      activeLabel.textContent = "Actual";
      input.closest("label").append(activeLabel);
    });
  });

  rolePreview.querySelector("#role-switcher-theme").addEventListener("click", (event) => {
    const enabled = event.currentTarget.getAttribute("aria-checked") !== "true";
    event.currentTarget.setAttribute("aria-checked", String(enabled));
    rolePreview.dataset.theme = enabled ? "dark" : "light";
  });

  rolePreview.querySelectorAll(".language-option").forEach((option) => {
    option.addEventListener("click", () => {
      rolePreview.querySelectorAll(".language-option").forEach((item) => {
        item.setAttribute("aria-pressed", String(item === option));
      });
    });
  });
</script>
