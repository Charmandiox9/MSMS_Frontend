<style>
  #role-switcher-preview {
    --account-surface: light-dark(#ffffff, #242527);
    --account-text: light-dark(#142b41, #f2f1f0);
    --account-muted: light-dark(#526978, #babbc0);
    --account-border: light-dark(#d8e2e8, #414246);
    --account-hover: light-dark(#f5f8f9, #2d2e30);
    --account-selection: light-dark(#dfefee, #393340);
    --account-accent: light-dark(#075e66, #c9b9ea);
    display: flex;
    width: 100%;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
    color-scheme: light;
    color: var(--account-text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
  }

  #role-switcher-preview[data-theme="dark"] {
    color-scheme: dark;
  }

  #role-switcher-preview *,
  #role-switcher-preview *::before,
  #role-switcher-preview *::after {
    box-sizing: border-box;
  }

  #role-switcher-preview button,
  #role-switcher-preview select {
    font: inherit;
  }

  #role-switcher-preview .account-popover,
  #role-switcher-preview .account-trigger {
    width: min(100%, 264px);
    border: 1px solid var(--account-border);
    border-radius: 12px;
    background: var(--account-surface);
  }

  #role-switcher-preview .account-popover {
    padding: 8px;
    box-shadow: 0 12px 28px light-dark(rgb(20 43 65 / 12%), rgb(0 0 0 / 30%));
  }

  #role-switcher-preview .menu-row {
    display: flex;
    width: 100%;
    min-height: 42px;
    align-items: center;
    gap: 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    padding: 8px 10px;
    color: var(--account-text);
    text-align: left;
  }

  #role-switcher-preview .menu-row:hover,
  #role-switcher-preview .language-option:hover {
    background: var(--account-hover);
  }

  #role-switcher-preview .menu-row > span:first-of-type {
    flex: 1;
  }

  #role-switcher-preview .menu-icon {
    width: 16px;
    height: 16px;
    flex: none;
    color: var(--account-muted);
  }

  #role-switcher-preview .role-field {
    display: grid;
    gap: 4px;
    padding: 4px 10px 8px;
  }

  #role-switcher-preview .role-field label {
    color: var(--account-muted);
    font-size: 12px;
    font-weight: 400;
  }

  #role-switcher-preview .role-select {
    width: 100%;
    min-height: 42px;
    border: 1px solid var(--account-border);
    border-radius: 6px;
    background-color: var(--account-surface);
    padding: 8px;
    color: var(--account-text);
  }

  #role-switcher-preview .role-select option {
    background: var(--account-surface);
    color: var(--account-text);
  }

  #role-switcher-preview .menu-divider {
    height: 1px;
    margin: 5px 0;
    border: 0;
    background: var(--account-border);
  }

  #role-switcher-preview .preference-row {
    display: flex;
    min-height: 44px;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 8px;
    color: var(--account-text);
  }

  #role-switcher-preview .theme-switch {
    position: relative;
    width: 44px;
    height: 26px;
    flex: none;
    border: 1px solid var(--account-muted);
    border-radius: 999px;
    background: var(--account-hover);
  }

  #role-switcher-preview .theme-switch::after {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--account-muted);
    content: "";
    transition: transform 180ms ease-out, background-color 180ms ease-out;
  }

  #role-switcher-preview .theme-switch[aria-checked="true"] {
    border-color: var(--account-accent);
    background: var(--account-accent);
  }

  #role-switcher-preview .theme-switch[aria-checked="true"]::after {
    transform: translateX(18px);
    background: var(--account-surface);
  }

  #role-switcher-preview .language-options {
    display: flex;
    gap: 4px;
  }

  #role-switcher-preview .language-option {
    min-width: 42px;
    min-height: 36px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--account-muted);
  }

  #role-switcher-preview .language-option[aria-pressed="true"] {
    background: var(--account-selection);
    color: var(--account-text);
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  #role-switcher-preview .account-trigger {
    display: flex;
    min-height: 54px;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    color: var(--account-text);
    text-align: left;
  }

  #role-switcher-preview .avatar {
    display: grid;
    width: 36px;
    height: 36px;
    flex: none;
    place-items: center;
    border-radius: 50%;
    background: var(--account-selection);
    font-weight: 500;
  }

  #role-switcher-preview .account-copy {
    display: grid;
    min-width: 0;
    flex: 1;
  }

  #role-switcher-preview .account-copy strong {
    font-size: 14px;
    font-weight: 500;
  }

  #role-switcher-preview .account-copy span {
    overflow: hidden;
    color: var(--account-muted);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #role-switcher-preview .account-trigger .menu-icon {
    width: 16px;
    height: 16px;
  }

  #role-switcher-preview .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    clip-path: inset(50%);
  }
</style>

<div id="role-switcher-preview" class="viz-dotted-background" data-theme="light" role="region" aria-label="Menú de cuenta de MARSYS">
  <section class="account-popover" aria-label="Opciones de cuenta">
    <button class="menu-row" type="button" aria-label="Mi perfil">
      <i class="menu-icon" data-lucide="user-round" aria-hidden="true"></i>
      <span>Mi perfil</span>
    </button>
    <div class="role-field">
      <label for="role-switcher-select">Rol activo</label>
      <select class="role-select" id="role-switcher-select">
        <option value="Apoyo docente" selected>Apoyo docente</option>
        <option value="Administrador del sistema">Administrador del sistema</option>
        <option value="Analista académico">Analista académico</option>
        <option value="Secretario docente">Secretario docente</option>
      </select>
    </div>
    <hr class="menu-divider">
    <div class="preference-row">
      <span>Modo oscuro</span>
      <button class="theme-switch" id="role-switcher-theme" type="button" role="switch" aria-label="Modo oscuro" aria-checked="false"></button>
    </div>
    <div class="preference-row">
      <span>Idioma</span>
      <span class="language-options" role="group" aria-label="Idioma">
        <button class="language-option" type="button" aria-pressed="true">ES</button>
        <button class="language-option" type="button" aria-pressed="false">EN</button>
      </span>
    </div>
    <hr class="menu-divider">
    <button class="menu-row" type="button" aria-label="Cerrar sesión">
      <i class="menu-icon" data-lucide="log-out" aria-hidden="true"></i>
      <span>Cerrar sesión</span>
    </button>
    <span class="sr-only" id="role-switcher-status" aria-live="polite"></span>
  </section>

  <button class="account-trigger" type="button" aria-label="Mi cuenta">
    <span class="avatar" aria-hidden="true">M</span>
    <span class="account-copy">
      <strong>Mi cuenta</strong>
      <span id="role-switcher-active-role">Apoyo docente</span>
    </span>
    <i class="menu-icon" data-lucide="chevrons-up-down" aria-hidden="true"></i>
  </button>
</div>

<script>
  const rolePreview = document.getElementById("role-switcher-preview");
  const roleSelect = rolePreview.querySelector("#role-switcher-select");
  const roleStatus = rolePreview.querySelector("#role-switcher-status");
  const activeRoleLabel = rolePreview.querySelector("#role-switcher-active-role");
  const assignedRoles = Array.from(roleSelect.options, (option) => option.value);

  function renderRole() {
    activeRoleLabel.textContent = roleSelect.value;
    roleStatus.textContent = "Rol activo: " + roleSelect.value;
  }

  function restoreRoleSelection(widgetState) {
    const selectedRole = widgetState?.modelContent?.selectedRole;
    if (!assignedRoles.includes(selectedRole)) return;
    roleSelect.value = selectedRole;
    renderRole();
  }

  function persistRoleSelection() {
    if (typeof globalThis.openai?.setWidgetState !== "function") return;
    globalThis.openai.setWidgetState({
      modelContent: { selectedRole: roleSelect.value },
      privateContent: null
    }).catch(() => {});
  }

  roleSelect.addEventListener("change", () => {
    renderRole();
    persistRoleSelection();
  });

  rolePreview.querySelector("#role-switcher-theme").addEventListener("click", (event) => {
    const enabled = event.currentTarget.getAttribute("aria-checked") !== "true";
    event.currentTarget.setAttribute("aria-checked", String(enabled));
    rolePreview.dataset.theme = enabled ? "dark" : "light";
  });

  rolePreview.querySelectorAll(".language-option").forEach((option) => {
    option.addEventListener("click", () => {
      rolePreview.querySelectorAll(".language-option").forEach((item) => {
        item.setAttribute("aria-pressed", String(item === option));
      });
    });
  });

  restoreRoleSelection(globalThis.openai?.widgetState);
  window.addEventListener("openai:set_globals", (event) => {
    restoreRoleSelection(event.detail?.globals?.widgetState);
  });
</script>
